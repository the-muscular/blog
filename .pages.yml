# Pages CMS config (https://pagescms.org). Generated by scripts/cms-config.mjs — edit that script, not this file.
media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      fields: [title, topic, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: topic
        label: Topic
        type: select
        required: true
        options:
          values: ["Travel","Music","Movies","Family","Likes","Journal","Politics"]
      - name: excerpt
        label: Excerpt
        description: Optional. One or two sentences for the post card. Leave empty to use the start of the post.
        type: text
      - name: doodle
        label: Cover illustration
        description: "Optional. Leave empty for the topic's default (Travel: Plane, Music: Record, Movies: Popcorn, Family: House, Likes: Heart, Journal: Journal, Politics: Ballot box). See them all on your site at /covers/"
        type: select
        options:
          values:
            - name: "plane"
              label: "Travel · Plane"
            - name: "suitcase"
              label: "Travel · Suitcase"
            - name: "hills"
              label: "Travel · Hills"
            - name: "pin"
              label: "Travel · Map pin"
            - name: "beach"
              label: "Travel · Beach"
            - name: "camera"
              label: "Travel · Camera"
            - name: "vinyl"
              label: "Music · Record"
            - name: "headphones"
              label: "Music · Headphones"
            - name: "notes"
              label: "Music · Music notes"
            - name: "cassette"
              label: "Music · Cassette"
            - name: "clapper"
              label: "Movies · Clapper"
            - name: "popcorn"
              label: "Movies · Popcorn"
            - name: "ticket"
              label: "Movies · Ticket"
            - name: "tv"
              label: "Movies · TV"
            - name: "family"
              label: "Family · Family"
            - name: "house"
              label: "Family · House"
            - name: "cake"
              label: "Family · Cake"
            - name: "bowl"
              label: "Family · Bowl"
            - name: "dress"
              label: "Likes · fashion · Dress"
            - name: "handbag"
              label: "Likes · fashion · Handbag"
            - name: "sunglasses"
              label: "Likes · fashion · Sunglasses"
            - name: "gradcap"
              label: "Likes · courses · Grad cap"
            - name: "pencil"
              label: "Likes · courses · Pencil"
            - name: "laptop"
              label: "Likes · courses · Laptop"
            - name: "book"
              label: "Likes · courses · Book"
            - name: "teddy"
              label: "Likes · toys · Teddy"
            - name: "blocks"
              label: "Likes · toys · Blocks"
            - name: "duck"
              label: "Likes · toys · Rubber duck"
            - name: "heart"
              label: "Likes · everyday · Heart"
            - name: "star"
              label: "Likes · everyday · Star"
            - name: "icecream"
              label: "Likes · everyday · Ice cream"
            - name: "coffee"
              label: "Likes · everyday · Coffee"
            - name: "plant"
              label: "Likes · everyday · Plant"
            - name: "sun"
              label: "Likes · everyday · Sun"
            - name: "journal"
              label: "Journal · Journal"
            - name: "envelope"
              label: "Journal · Letter"
            - name: "calendar"
              label: "Journal · Calendar"
            - name: "ballot"
              label: "Politics · Ballot box"
            - name: "megaphone"
              label: "Politics · Megaphone"
            - name: "newspaper"
              label: "Politics · Newspaper"
            - name: "speech"
              label: "Politics · Speech bubbles"
            - name: "scales"
              label: "Politics · Scales"
      - name: colour
        label: Cover colour
        description: Optional. Leave empty for the topic's default colour.
        type: select
        options:
          values:
            - name: "wisteria"
              label: "Wisteria"
            - name: "milk"
              label: "Milkshake"
            - name: "slipper"
              label: "Ballet slipper"
            - name: "latte"
              label: "Latte"
            - name: "seafoam"
              label: "Seafoam"
            - name: "rainy"
              label: "Rainy day"
            - name: "attic"
              label: "Attic window"
            - name: "butter"
              label: "Butter yellow"
            - name: "apricot"
              label: "Apricot jam"
            - name: "matcha"
              label: "Matcha"
            - name: "clover"
              label: "Clover"
            - name: "cherry"
              label: "Cherry"
      - name: cover_image
        label: Cover photo
        description: Optional. Replaces the illustration with a photo. Most posts don't need one.
        type: image
      - name: draft
        label: Draft
        description: Drafts are saved but don't appear on the live site.
        type: boolean
        default: false
      - name: body
        label: Post
        type: rich-text

  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: title
        label: Blog title
        description: The last word gets the italic squiggle treatment.
        type: string
        required: true
      - name: kicker
        label: Small line above the title
        type: string
      - name: intro
        label: Intro under the title
        type: text
      - name: author
        label: Your name
        type: string
      - name: bio
        label: Short bio in the sidebar
        type: text
      - name: sticker
        label: Sticker text
        type: string
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: network
            label: Network
            type: select
            options:
              values: ["instagram","x","linkedin","pinterest","tiktok","youtube","spotify","letterboxd","email","website"]
          - name: url
            label: Link
            description: Full address, e.g. https://instagram.com/yourname, or mailto:you@example.com for email.
            type: string
          - name: handle
            label: Handle shown next to the link
            type: string
